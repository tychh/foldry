[workspace]
members = [
  "crates/foldry-application",
  "crates/foldry-cli",
  "crates/foldry-core",
  "crates/foldry-storage",
  "crates/foldry-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
authors = ["tychh"]
description = "Safe, explainable folder archiving with reusable filtering profiles"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
atomicwrites = "0.4.4"
clap = { version = "4.6.4", features = ["derive"] }
ctrlc = "3.5.2"
directories = "6.0.0"
flate2 = "1.1.9"
ignore = "0.4.31"
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std", "tz-system"] }
libc = "0.2"
proptest = "1.11.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.11.5" }
tauri-build = { version = "2.6.3" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3.27.0"
thiserror = "2.0.19"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
